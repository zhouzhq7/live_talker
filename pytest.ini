[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    # Phase markers
    phase1: Phase 1 - ASR (SenseVoice) tests
    phase2: Phase 2 - TTS (MeloTTS) tests
    phase3: Phase 3 - VAD (TEN-VAD) tests
    phase4: Phase 4 - LLM (Ollama) tests
    phase5: Phase 5 - Streaming tests
    
    # Test type markers
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    acceptance: Acceptance tests
    
    # Feature markers
    slow: Slow tests (skip with -m "not slow")
    gpu: Tests requiring GPU
    network: Tests requiring network
    local_only: Tests for local LLM only
    
    # Module markers
    asr: ASR related tests
    tts: TTS related tests
    vad: VAD related tests
    llm: LLM related tests
    streaming: Streaming tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration
cov_report = term-missing
cov_fail_under = 80
